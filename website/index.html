<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SOLBEAM — Atomic wrapper on Solana for BSV</title>
  <meta name="description" content="SOLBEAM brings native BSV to Solana as solBSV: a 1:1 wrapper you can hold, trade and redeem. Trustless minting, permissionless redemption." />
  <meta name="theme-color" content="#05060A" />

  <!-- Social preview. TODO: add a 1200x630 image at /assets/og.png and uncomment.
  <meta property="og:image" content="/assets/og.png" />
  -->
  <meta property="og:title" content="SOLBEAM" />
  <meta property="og:description" content="Atomic wrapper on Solana for BSV." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://solbeam.me/" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/solana.webp" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="bg__glow bg__glow--purple"></span>
    <span class="bg__glow bg__glow--green"></span>
    <span class="bg__glow bg__glow--blue"></span>
    <span class="bg__grid"></span>
  </div>

  <main class="wrap">
    <!-- The coin: shows the Solana mark, spins, reveals the BSV mark -->
    <div class="coin" role="img" aria-label="A coin showing the Solana logo, spinning to reveal the BSV logo">
      <div class="coin__halo" aria-hidden="true"></div>
      <div class="coin__inner">
        <div class="coin__face coin__face--sol">
          <img src="/assets/solana.webp" alt="" width="316" height="316" />
        </div>
        <div class="coin__face coin__face--bsv">
          <img src="/assets/bsv.jpg" alt="" width="1000" height="1000" loading="eager" decoding="async" />
        </div>
      </div>
    </div>

    <h1 class="title">SOLBEAM</h1>
    <p class="tagline">Atomic wrapper on Solana for <span class="tick">BSV</span></p>

    <section class="steps" aria-label="How it works">
      <div class="step">
        <span class="step__num">Step 1</span>
        <span class="step__label">Accumulate</span>
      </div>
      <div class="step__arrow" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
      <div class="step">
        <span class="step__num">Step 2</span>
        <span class="step__label">Wait</span>
      </div>
    </section>

    <div class="cta">
      <a class="btn" href="https://github.com/solbeam-bot/solbeam" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        GitHub
      </a>
    </div>

    <p class="fineprint">
      1:1 wrapper &middot; Trustless minting &middot; Permissionless redemption &middot; No federation
    </p>
  </main>

  <footer class="footer">
    <span>&copy; <span id="year">2026</span> SOLBEAM</span>
    <span class="dot" aria-hidden="true">&middot;</span>
    <a href="/about/">About</a>
    <span class="dot" aria-hidden="true">&middot;</span>
    <a href="https://github.com/solbeam-bot/solbeam" target="_blank" rel="noopener">GitHub</a>
  </footer>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
