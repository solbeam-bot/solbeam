[package]
name = "solbeam"
version = "0.1.0"
description = "SOLBEAM — the BSV light client on Solana, and the solBSV peg"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solbeam"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []

[dependencies]
# Only anchor-lang. `solana_program` is used via `anchor_lang::solana_program`
# so there is exactly one version of it in the build — a direct dependency here
# is the usual cause of a version-mismatch build failure.
anchor-lang = "1.2.0"
