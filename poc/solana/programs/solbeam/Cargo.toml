[package]
name = "solbeam"
version = "0.1.0"
description = "SOLBEAM — the BSV light client on Solana, and the solBSV peg"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solbeam"

[features]
# `custom-heap` and `custom-panic` are DECLARED BUT NOT ENABLED.
#
# `entrypoint!` expands `custom_heap_default!` and `custom_panic_default!` in
# *this* crate, and both macros test `#[cfg(feature = "custom-heap"/"custom-panic")]`
# against the calling crate's features. A feature that is referenced but never
# declared is the two `unexpected cfg condition value` warnings `anchor build`
# used to emit, so declaring them here is what makes those go away. Enabling
# `custom-heap` would suppress the SDK's global allocator and require this crate
# to provide one — and a larger allocator does not work on its own: the SBF heap
# frame is requested per transaction (`ComputeBudgetInstruction::RequestHeapFrame`,
# default 32 KiB), while the SDK `BumpAllocator` bumps *down* from
# `HEAP_START_ADDRESS + HEAP_LENGTH`, so its first allocation lands at the top of
# whatever length it was given. A >32 KiB allocator therefore faults with
# "Access violation in heap section" on every instruction unless every caller
# requests the matching frame.
#
# The F3 out-of-memory is instead fixed where it belongs: `push_fork_header` no
# longer deserialises the 192-record `LightClient` window at all (see
# `LightClientView` in `src/lib.rs`), so the instruction stays inside the
# default 32 KiB with no per-transaction heap request. These two features stay
# off for that reason.
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
custom-heap = []
custom-panic = []
# anchor-spl needs its own idl-build too, or IDL generation fails with
# E0599: no create_type / DISCRIMINATOR for anchor_spl::token::Mint.
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []

[dependencies]
# Only anchor-lang plus the hasher. `solana_program` itself is used via
# `anchor_lang::solana_program`, so there is exactly one version of it in the
# build — a direct dependency on it here is the usual cause of a
# version-mismatch failure.
# init-if-needed: so the recipient's token account can be created on their
# behalf, meaning a first-time user needs no SOL to RECEIVE solBSV.
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }

# token for the mint, associated_token for deriving the recipient's ATA.
anchor-spl = { version = "1.2.0", features = ["token", "associated_token"] }

# Solana 3.x moved SHA-256 out of `solana_program`, and anchor_lang re-exports
# no replacement, so this is needed directly. It calls the on-chain `sol_sha256`
# syscall on the SBF target; the `sha2` feature (not default) is what makes it
# work in a host build, which is why it is switched on explicitly.
solana-sha256-hasher = { version = "3", features = ["sha2"] }

# 256-bit unsigned arithmetic — `arith_uint256`'s counterpart — for cw-144. It
# is already in the tree transitively through the Solana SDK, but the difficulty
# module depends on it directly since W1.6, and naming a transitive dependency
# directly is what makes it a stable part of this crate's API rather than an
# accident of the SDK's.
uint = "0.10"
