# SOLBEAM PoC — Anchor workspace.
#
# Note for Anchor 1.x: the [registry] section is no longer recognised (it was
# removed in 1.0.0), so it is deliberately absent.
#
# Be aware that `anchor keys sync` REWRITES this file and STRIPS COMMENTS from
# it. The program id below is therefore the real one, synced once on the build
# box and folded back in, so that a fresh clone and the running box agree
# without anyone having to re-run sync.

[toolchain]
anchor_version = "1.2.0"

[features]
resolution = true
skip-lint = false

# The upgrade authority of a localnet deployment IS the authority the program
# trusts: `initialize` and `initialize_bridge` read the BPF upgradeable loader's
# `ProgramData` account and accept only `upgrade_authority_address ==
# Some(payer)`. Anchor's *legacy* validator embeds workspace programs in the
# genesis block instead of deploying them, and `upgradeable = true` is what makes
# that embed use `--upgradeable-program` with the wallet above as the upgrade
# authority. With the default (`false`) the program is embedded with
# `Pubkey::default()` as its authority, so NO key can ever satisfy the check,
# `initialize` is permanently refused, and the bridge can never start. See
# `../TEST_PLAN.md` §0.1 and `README.md` §Running it.
[test]
upgradeable = true

# The F4 authority timelock is measured in slots, deliberately, so that it can be
# read from `Clock` without trusting a wall clock. Tests have to wait it out, and
# at the validator's default 64 ticks per slot that is ~400 ms a slot; sixteen
# ticks a slot makes the local chain advance ~3x faster and keeps the suite near
# its former runtime. This changes nothing the program does — `Clock::slot` is a
# slot either way — only how long the local validator takes to produce one. (Two
# ticks a slot is too fast: the validator stops confirming transactions.)
[test.validator]
ticks_per_slot = 16

[programs.localnet]
# Derived from the keypair in target/deploy/solbeam-keypair.json, which is
# gitignored. A fresh clone with an empty target/ must run `anchor keys sync`
# to regenerate the pair and reuse this id.
solbeam = "EYsckW3596zBL1pxfxGev44z6LH4hEpoHff7tSisvjCW"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Plain mocha plus ts-node, NOT ts-mocha. ts-mocha hard-pins ts-node 7.0.1 — a
# 2018 release that cannot register the .ts loader on Node 18 — and npm nests
# that copy, so overriding it from the top level does not reliably win.
# Also not `yarn run`: the build box has npm and no yarn.
test = "npx mocha --require ts-node/register --timeout 1000000 tests/**/*.ts"
